apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: api-jwt
  namespace: shop
spec:
  selector:
    matchLabels:
      app: api
  jwtRules:
    - issuer: https://issuer.example.test/
      audiences: [shop-api]
      jwksUri: https://issuer.example.test/.well-known/jwks.json
