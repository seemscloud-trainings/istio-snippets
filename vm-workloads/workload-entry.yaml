---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory
---
apiVersion: networking.istio.io/v1
kind: WorkloadEntry
metadata:
  name: inventory-vm
spec:
  address: 10.20.0.23
  ports:
    http: 7070
  labels:
    app: inventory
  network: network1
  serviceAccount: inventory
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: inventory
spec:
  hosts: [inventory.wp.pl]
  addresses: [198.51.100.103]
  exportTo: [.]
  location: MESH_INTERNAL
  resolution: STATIC
  ports: [{number: 80, name: http, protocol: HTTP}]
  workloadSelector:
    labels:
      app: inventory
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: vm-apps
spec:
  host: '*.wp.pl'
  exportTo: [.]
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
---
apiVersion: networking.istio.io/v1beta1
kind: ProxyConfig
metadata:
  name: default
spec:
  environmentVariables:
    ISTIO_META_DNS_CAPTURE: 'true'
