apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders
---
apiVersion: networking.istio.io/v1
kind: WorkloadEntry
metadata:
  name: orders-vm
spec:
  address: 10.20.0.21
  ports:
    http: 8080
  labels:
    app: orders
  network: network1
  serviceAccount: orders
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: orders
spec:
  hosts: [orders.wp.pl]
  addresses: [198.51.100.101]
  exportTo: [.]
  location: MESH_INTERNAL
  resolution: STATIC
  ports: [{number: 80, name: http, protocol: HTTP}]
  workloadSelector:
    labels:
      app: orders
---
