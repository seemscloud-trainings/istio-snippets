apiVersion: v1
kind: Service
metadata:
  name: obs-empty
  namespace: playground-nimbus-istio-enabled
  labels:
    observability-lab: nimbus
    observability-scenario: empty
spec:
  selector:
    app: obs-no-such-pod
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: obs-empty
  namespace: playground-nimbus-istio-enabled
  labels:
    observability-lab: nimbus
    observability-scenario: empty
spec:
  hosts:
  - obs-empty.playground-nimbus-istio-enabled.svc.cluster.local
  gateways:
  - mesh
  exportTo:
  - .
  http:
  - route:
    - destination:
        host: obs-empty.playground-nimbus-istio-enabled.svc.cluster.local
        port:
          number: 80
    retries:
      attempts: 0
    timeout: 10s
---
apiVersion: batch/v1
kind: Job
metadata:
  name: obs-empty-traffic
  namespace: playground-nimbus-istio-enabled
  labels:
    observability-lab: nimbus
    observability-scenario: empty
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app: obs-empty-traffic
        observability-lab: nimbus
        istio.io/rev: blue
      annotations:
        sidecar.istio.io/inject: 'true'
        sidecar.istio.io/nativeSidecar: 'true'
        proxy.istio.io/config: '{"proxyStatsMatcher": {"inclusionRegexps": [".*upstream_rq_.*", ".*upstream_cx_.*", ".*cds_update_.*",
          ".*lds_update_.*", ".*listener_manager.*", ".*cluster_manager.*"]}}'
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: traffic
        image: python:3.12-alpine
        command:
        - python
        - -u
        - -c
        - |
          import time,os,threading,urllib.request,urllib.error,collections
          from concurrent.futures import ThreadPoolExecutor
          time.sleep(30)
          end=time.monotonic()+180;counts=collections.Counter();lock=threading.Lock()
          def worker(_):
           while time.monotonic()<end:
            headers={"Host":os.environ["HOST"]} if os.getenv("HOST") else {}
            try:
             with urllib.request.urlopen(urllib.request.Request(os.environ["URL"],headers=headers),timeout=5) as r:r.read();code=r.status
            except urllib.error.HTTPError as e:code=e.code;e.read();e.close()
            except Exception as e:code=type(e).__name__
            with lock:counts[str(code)]+=1
            time.sleep(.05)
          def report():
           while time.monotonic()<end:
            time.sleep(15)
            with lock:print(dict(counts),flush=True)
          threading.Thread(target=report,daemon=True).start()
          with ThreadPoolExecutor(max_workers=20) as pool:list(pool.map(worker,range(20)))
          print("FINAL",dict(counts),flush=True)
        env:
        - name: URL
          value: http://obs-empty.playground-nimbus-istio-enabled.svc.cluster.local
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
