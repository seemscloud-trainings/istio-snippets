apiVersion: v1
kind: Service
metadata:
  name: obs-empty
  namespace: playground-nimbus-istio-enabled
  labels:
    observability-lab: nimbus
    observability-scenario: empty
spec:
  selector:
    app: obs-no-such-pod
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: obs-empty
  namespace: playground-nimbus-istio-enabled
  labels:
    observability-lab: nimbus
    observability-scenario: empty
spec:
  hosts:
  - obs-empty.playground-nimbus-istio-enabled.svc.cluster.local
  gateways:
  - mesh
  exportTo:
  - .
  http:
  - route:
    - destination:
        host: obs-empty.playground-nimbus-istio-enabled.svc.cluster.local
        port:
          number: 80
    retries:
      attempts: 0
    timeout: 10s
---
apiVersion: batch/v1
kind: Job
metadata:
  name: obs-empty-traffic
  namespace: playground-nimbus-istio-enabled
  labels:
    observability-lab: nimbus
    observability-scenario: empty
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app: obs-empty-traffic
        observability-lab: nimbus
        istio.io/rev: blue
      annotations:
        sidecar.istio.io/inject: 'true'
        sidecar.istio.io/nativeSidecar: 'true'
        proxy.istio.io/config: '{"proxyStatsMatcher": {"inclusionRegexps": [".*upstream_rq_.*",
          ".*upstream_cx_.*", ".*cds_update_.*", ".*lds_update_.*", ".*listener_manager.*",
          ".*cluster_manager.*"]}}'
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: traffic
        image: python:3.12-alpine
        command:
        - python
        - -u
        - -c
        - "import time,os,threading,urllib.request,urllib.error,collections\nfrom\
          \ concurrent.futures import ThreadPoolExecutor\n# Wait for deployment and\
          \ xDS propagation; no human request loop needed.\ntime.sleep(30)\nend=time.monotonic()+180;counts=collections.Counter();lock=threading.Lock()\n\
          def worker(_):\n while time.monotonic()<end:\n  try:\n   r=urllib.request.urlopen(urllib.request.Request(os.environ[\"\
          URL\"],headers={\"Host\":\"obs.nimbus.test\"}),timeout=5);r.read();code=r.status\n\
          \  except urllib.error.HTTPError as e:code=e.code;e.read()\n  except Exception\
          \ as e:code=type(e).__name__\n  with lock:counts[str(code)]+=1\n  time.sleep(.05)\n\
          with ThreadPoolExecutor(max_workers=20) as pool:list(pool.map(worker,range(20)))\n\
          print(dict(counts),flush=True)\n"
        env:
        - name: URL
          value: http://obs-empty.playground-nimbus-istio-enabled.svc.cluster.local
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
