apiVersion: apps/v1
kind: Deployment
metadata:
  name: obs-oom
  namespace: playground-nimbus-istio-enabled
  labels:
    observability-lab: nimbus
    observability-scenario: oom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obs-oom
  template:
    metadata:
      labels:
        app: obs-oom
        observability-lab: nimbus
        istio.io/rev: blue
      annotations:
        sidecar.istio.io/inject: 'true'
        proxy.istio.io/config: '{"proxyStatsMatcher": {"inclusionRegexps": [".*upstream_rq_.*", ".*upstream_cx_.*", ".*cds_update_.*",
          ".*lds_update_.*", ".*listener_manager.*", ".*cluster_manager.*"]}}'
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: python:3.12-alpine
        command:
        - python
        - -u
        - -c
        - |
          import os,time,socket,struct,threading
          from http.server import ThreadingHTTPServer,BaseHTTPRequestHandler
          mode=os.getenv("MODE","healthy")
          class Handler(BaseHTTPRequestHandler):
           def do_GET(self):
            if self.path=="/ready":
             self.send_response(503 if mode=="unready" or (mode=="churn" and int(time.time()/5)%2) else 200);self.end_headers();return
            if mode=="slow":time.sleep(3)
            if mode=="reset":
             self.connection.setsockopt(socket.SOL_SOCKET,socket.SO_LINGER,struct.pack("ii",1,0));self.connection.close();return
            code=503 if mode=="flaky" and int(time.time()*1000)%3 else 200
            self.send_response(code);self.end_headers()
            try:self.wfile.write(b"observability lab")
            except (BrokenPipeError,ConnectionResetError):pass
           def log_message(self,*args):pass
          if mode=="oom":
           def allocate():
            time.sleep(20);data=[]
            while True:data.append(bytearray(1024*1024));time.sleep(.02)
           threading.Thread(target=allocate,daemon=True).start()
          ThreadingHTTPServer(("0.0.0.0",8080),Handler).serve_forever()
        env:
        - name: MODE
          value: oom
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 48Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          periodSeconds: 1
          failureThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: obs-oom
  namespace: playground-nimbus-istio-enabled
  labels:
    observability-lab: nimbus
    observability-scenario: oom
spec:
  selector:
    app: obs-oom
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: obs-oom
  namespace: playground-nimbus-istio-enabled
  labels:
    observability-lab: nimbus
    observability-scenario: oom
spec:
  hosts:
  - obs-oom.playground-nimbus-istio-enabled.svc.cluster.local
  gateways:
  - mesh
  exportTo:
  - .
  http:
  - route:
    - destination:
        host: obs-oom.playground-nimbus-istio-enabled.svc.cluster.local
        port:
          number: 80
    retries:
      attempts: 0
    timeout: 10s
---
apiVersion: batch/v1
kind: Job
metadata:
  name: obs-oom-traffic
  namespace: playground-nimbus-istio-enabled
  labels:
    observability-lab: nimbus
    observability-scenario: oom
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app: obs-oom-traffic
        observability-lab: nimbus
        istio.io/rev: blue
      annotations:
        sidecar.istio.io/inject: 'true'
        sidecar.istio.io/nativeSidecar: 'true'
        proxy.istio.io/config: '{"proxyStatsMatcher": {"inclusionRegexps": [".*upstream_rq_.*", ".*upstream_cx_.*", ".*cds_update_.*",
          ".*lds_update_.*", ".*listener_manager.*", ".*cluster_manager.*"]}}'
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: traffic
        image: python:3.12-alpine
        command:
        - python
        - -u
        - -c
        - |
          import time,os,threading,urllib.request,urllib.error,collections
          from concurrent.futures import ThreadPoolExecutor
          time.sleep(30)
          end=time.monotonic()+180;counts=collections.Counter();lock=threading.Lock()
          def worker(_):
           while time.monotonic()<end:
            headers={"Host":os.environ["HOST"]} if os.getenv("HOST") else {}
            try:
             with urllib.request.urlopen(urllib.request.Request(os.environ["URL"],headers=headers),timeout=5) as r:r.read();code=r.status
            except urllib.error.HTTPError as e:code=e.code;e.read();e.close()
            except Exception as e:code=type(e).__name__
            with lock:counts[str(code)]+=1
            time.sleep(.05)
          def report():
           while time.monotonic()<end:
            time.sleep(15)
            with lock:print(dict(counts),flush=True)
          threading.Thread(target=report,daemon=True).start()
          with ThreadPoolExecutor(max_workers=20) as pool:list(pool.map(worker,range(20)))
          print("FINAL",dict(counts),flush=True)
        env:
        - name: URL
          value: http://obs-oom.playground-nimbus-istio-enabled.svc.cluster.local
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
