apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: api-mtls
  namespace: shop
spec:
  selector:
    matchLabels:
      app: api
  mtls:
    mode: PERMISSIVE
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: api-access
  namespace: shop
spec:
  selector:
    matchLabels:
      app: api
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/shop/sa/reader
      to:
        - operation:
            methods: [GET]
            paths: [/orders]
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: api-plaintext-client
  namespace: shop
spec:
  host: api.shop.svc.cluster.local
  exportTo:
    - "."
  workloadSelector:
    matchLabels:
      app: plain
  trafficPolicy:
    tls:
      mode: DISABLE
