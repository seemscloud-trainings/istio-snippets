apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: api-mtls
spec:
  mtls:
    mode: PERMISSIVE
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: api-access
spec:
  action: ALLOW
  rules:
  - from:
    - source:
        principals: [cluster.local/ns/shop/sa/reader]
    to:
    - operation:
        methods: [GET]
        paths: [/orders]
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: api-plaintext-client
spec:
  host: api.shop.svc.cluster.local
  exportTo: [.]
  trafficPolicy:
    tls:
      mode: DISABLE
