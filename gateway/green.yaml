apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: gateway-green
spec:
  selector:
    istio: gateway-green
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts: [wp.pl]
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: gateway-green
spec:
  hosts: [wp.pl]
  gateways: [gateway-green]
  exportTo: [.]
  http:
  - route:
    - destination:
        host: playground-trouble.prod-playground-trouble.svc.cluster.local
        port:
          number: 80
